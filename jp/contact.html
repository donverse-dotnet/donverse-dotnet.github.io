<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./contact.css" rel="stylesheet" type="text/css" />

  <link type="image/x-icon" rel="icon" href="../assets/community-logo-modified.png">
  <link type="image/x-icon" rel="shortcut icon" href="../assets/community-logo-modified.png">

  <meta property="og:title" content="Donverse Community" />
  <meta property="og:description" content="「Try more, create the best. 」This community covers content such as web service and application development, game tournaments, online and offline events, and learning languages and programming. You too can become a creator, performer, or viewer of this content. We look forward to your participation!" />
  <meta property="og:image" content="https://raw.githubusercontent.com/donverse-dotnet/donverse-dotnet.github.io/93ac5ebf266a4c8fde23aaebccfb30cd425488f3/assets/community-logo-modified.png" />

  <title>Contact Us | Donverse Community</title>
</head>

<body>
  <h2>お問い合わせ方法をお選びください：</h2>
  <div class="contact-options">
    <a href="https://github.com/donverse-dotnet/Community/issues" class="contact-link">
      <button class="contact-btn">
        <img src="../assets/github-logo.png" alt="GitHub Issues" class="contact-img">
        <span>GitHub イシュー</span>
      </button>
    </a>
    <a href="mailto:donversecommunity@gmail.com" class="contact-link">
      <button class="contact-btn">
        <img src="../assets/email.png" alt="Mail to" class="contact-img contact-img-invert">
        <span>メールで連絡</span>
      </button>
    </a>
    <a href="./join-discord.html" class="contact-link">
      <button class="contact-btn">
        <img src="../assets/discord-logo.png" alt="Discord" class="contact-img">
        <span>Discord 参加</span>
      </button>
    </a>
  </div>

</html>
