<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./contact-us.css" rel="stylesheet" type="text/css" />
    <link type="image/x-icon" rel="icon" href="../assets/community-logo-modified.png">
    <link type="image/x-icon" rel="shortcut icon" href="../assets/community-logo-modified.png">
    <meta property="og:title" content="Donverse コミュニティ" />
    <meta property="og:description" content="『Try more, create the best.』このコミュニティでは、Webサービスやアプリ開発、ゲーム大会、オンライン・オフラインイベント、語学やプログラミング学習などのコンテンツを扱っています。あなたもこのコンテンツのクリエイター、パフォーマー、または視聴者になれます。ご参加をお待ちしています！" />
    <meta property="og:image" content="https://raw.githubusercontent.com/donverse-dotnet/donverse-dotnet.github.io/93ac5ebf266a4c8fde23aaebccfb30cd425488f3/assets/community-logo-modified.png" />
    <meta property="og:url" content="https://lab.donverse.net" />
    <meta property="og:type" content="website" />
    <title>お問い合わせ | Donverse コミュニティ</title>
</head>

<body>
    <h2>お問い合わせ方法を選択してください：</h2>
    <div class="contact-options" style="display: flex; flex-direction: row; align-items: flex-start; justify-content: flex-start; gap: 10px;">
        <a href="https://github.com/donverse-dotnet/Community/issues" style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px;">
            <button style="height: 60px; width: 200px; display: flex; flex-direction: row; align-items: center; justify-content: center;">
                <img src="../assets/github-logo.png" alt="GitHub Issues" style="width: 30px; height: 30px; margin-right: 10px;">
                <span>GitHub Issues</span>
            </button>
        </a>
        <a href="mailto:donversecommunity@gmail.com" style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px;">
            <button style="height: 60px; width: 200px; display: flex; flex-direction: row; align-items: center; justify-content: center;">
                <img src="../assets/email.png" alt="メール" style="width: 30px; height: 30px; margin-right: 10px; filter: invert(100%);">
                <span>メールで連絡</span>
            </button>
        </a>
        <a href="./join-discord.html" style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px;">
            <button style="height: 60px; width: 200px; display: flex; flex-direction: row; align-items: center; justify-content: center;">
                <img src="../assets/discord-logo.png" alt="Discord" style="width: 30px; height: 30px; margin-right: 10px;">
                <span>Discord 参加</span>
            </button>
        </a>
    </div>
</body>

</html>
