<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./index.css" rel="stylesheet" type="text/css" />

    <link type="image/x-icon" rel="icon" href="../../assets/community-logo-modified.png">
    <link type="image/x-icon" rel="shortcut icon" href="../../assets/community-logo-modified.png">

    <meta property="og:title" content="Donverse Community" />
    <meta property="og:description" content="「Try more, create the best. 」This community covers content such as web service and application development, game tournaments, online and offline events, and learning languages and programming. You too can become a creator, performer, or viewer of this content. We look forward to your participation!" />
    <meta property="og:image" content="https://raw.githubusercontent.com/donverse-dotnet/donverse-dotnet.github.io/93ac5ebf266a4c8fde23aaebccfb30cd425488f3/assets/community-logo-modified.png" />
    <meta property="og:url" content="https://lab.donverse.net" />
    <meta property="og:type" content="website" />

    <title>Donverse Community</title>
</head>

<body style="display: flex; flex-direction: row; align-items: flex-start; justify-content: flex-start; height: 100vh; width: 100vw;">
    <div class="sidebar" style="display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; width: 80px; background-color: #000000;">
        <a href="../index.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80px; width: 80px;">
            <img src="../../assets/community-logo-modified.png" alt="Logo" style="width: 60px; height: 60px;">
        </a>
        <div class="links">
            <a href="../join-discord.html">
                <img src="../../assets/discord-logo.png" alt="Discord" style="width: 30px; height: 30px; margin: 10px;">
            </a>
            <a href="https://github.com/donverse-dotnet">
                <img src="../../assets/github-logo.png" alt="GitHub" style="width: 30px; height: 30px; margin: 10px;">
            </a>
            <a href="https://x.com">
                <img src="../../assets/x-logo.png" alt="X" style="width: 30px; height: 30px; margin: 10px;">
            </a>
        </div>
    </div>
    <div class="content" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; width: 100%;">
        <div class="header" style="
                        height: 80px; width: calc(100% - 12px);
                        padding-right: 12px;
                        display: flex;
                        flex-direction: row; align-items: center; justify-content: flex-end;
                        background-color: #000000; color: white;
                        font-family: 'oswald-bold'; font-size: 24px; gap: 15px;">
            <select onchange="window.localStorage.setItem('lang', this.value); location = `/${this.value}/index.html`;" style="background-color: #000000; color: white; font-family: 'oswald-bold'; font-size: 18px; padding: 5px;">
                <option value="en">English</option>
                <option value="jp">日本語</option>
            </select>
            <h3><a href="../staffs/index.html">Staffs</a></h3>
            <h3><a href="../docs/index.html">Docs</a></h3>
            <h3><a href="../contact-us.html">Contact</a></h3>
            <button><a href="../join-discord.html">Join</a></button>
        </div>
        <div class="main" style="height: 100%; width: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 20px; background-color: #000000; color: white;">
            <div class="main-content-wrapper" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: calc(100% - 50px); gap: 20px; padding: 25px;">
                <div class="card-grid">
                    <div class="card">
                        <div class="card-title">運営方針</div>
                        <div class="card-detail">Donverse Communityの理念や方針を説明します。</div>
                        <button class="card-btn"><a href="./community/roadmap.html">方針を見る</a></button>
                    </div>
                    <div class="card">
                        <div class="card-title">ルール</div>
                        <div class="card-detail">参加者が守るべき基本的なルールやマナーをまとめています。</div>
                        <button class="card-btn"><a href="../rules/index.html">ルールを確認</a></button>
                    </div>
                    <div class="card">
                        <div class="card-title">開発ドキュメント</div>
                        <div class="card-detail">コミュニティで開発されたツールやサービスの技術ドキュメントです。</div>
                        <button class="card-btn"><a href="../docs/development.html">ドキュメントを読む</a></button>
                    </div>
                    <div class="card">
                        <div class="card-title">イベント情報</div>
                        <div class="card-detail">過去・現在のイベント情報や参加方法などを掲載しています。</div>
                        <button class="card-btn"><a href="../events/index.html">イベントを見る</a></button>
                    </div>
                    <div class="card">
                        <div class="card-title">ブログ</div>
                        <div class="card-detail">活動報告や技術記事、スタッフコラムなどを掲載しています。</div>
                        <button class="card-btn"><a href="../blog/index.html">ブログを見る</a></button>
                    </div>
                    <div class="card">
                        <div class="card-title">スタッフ</div>
                        <div class="card-detail">運営スタッフの紹介や役割、連絡先などを掲載しています。</div>
                        <button class="card-btn"><a href="../staffs/index.html">スタッフを見る</a></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
